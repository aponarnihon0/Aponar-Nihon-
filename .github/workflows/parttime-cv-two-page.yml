name: Part-time CV Two Page
on:
  push:
    paths:
      - '.github/workflows/parttime-cv-two-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate two-page template
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cv-builder.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="/cv-parttime-v2.css?v=2">'
          js = '<script src="/cv-parttime-v2.js?v=2"></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          if sw.exists():
              t = sw.read_text(encoding='utf-8')
              t = t.replace('aponar-nihon-static-v13', 'aponar-nihon-static-v14')
              t = t.replace('aponar-nihon-dynamic-v13', 'aponar-nihon-dynamic-v14')
              if '"/cv-parttime-v2.css"' not in t:
                  t = t.replace('  "/cv-builder.html",', '  "/cv-builder.html",\n  "/cv-parttime-v2.css",\n  "/cv-parttime-v2.js",', 1)
              sw.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cv-builder.html sw.js
          git diff --cached --quiet || git commit -m "Integrate two-page part-time CV template"
          git push
