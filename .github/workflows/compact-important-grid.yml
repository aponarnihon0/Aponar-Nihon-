name: Compact important grid

on:
  push:
    paths:
      - '.github/workflows/compact-important-grid.yml'

permissions:
  contents: write

jobs:
  compact-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact three-row mobile layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          block = r'''
<style id="important-section-compact-v2">
/* Compact mobile Home quick-tools: 13 items fit in three rows (5 + 5 + 3). */
@media (max-width: 767px) {
  .app-home-screen {
    padding-left: 10px !important;
    padding-right: 10px !important;
    padding-bottom: 24px !important;
  }

  .app-tools-card {
    margin-top: 14px !important;
    padding: 16px 8px 13px !important;
    border-radius: 22px !important;
  }

  .app-card-heading {
    padding: 0 5px 10px !important;
  }

  .app-card-heading span {
    font-size: 9px !important;
  }

  .app-card-heading h2 {
    margin-top: 1px !important;
    font-size: 17px !important;
    line-height: 1.16 !important;
  }

  .app-card-heading > a {
    width: 34px !important;
    height: 34px !important;
    border-radius: 11px !important;
  }

  .app-tools-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    column-gap: 3px !important;
    row-gap: 10px !important;
    align-items: start !important;
  }

  .app-tool-item {
    min-width: 0 !important;
    gap: 0 !important;
  }

  .app-tool-icon {
    width: 47px !important;
    height: 47px !important;
    border-radius: 14px !important;
    margin-bottom: 5px !important;
    font-size: 18px !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 13px rgba(38,62,89,.14) !important;
  }

  .app-tool-icon b {
    font-size: 15px !important;
    letter-spacing: -.35px !important;
  }

  .app-tool-item strong {
    width: 100% !important;
    min-height: 22px !important;
    margin: 0 !important;
    font-size: 9.6px !important;
    line-height: 1.1 !important;
    font-weight: 800 !important;
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
    display: flex !important;
    align-items: flex-start !important;
    justify-content: center !important;
  }

  .app-tool-item small {
    width: 100% !important;
    min-height: 15px !important;
    margin-top: 1px !important;
    font-size: 7.1px !important;
    line-height: 1.08 !important;
    white-space: normal !important;
    overflow: visible !important;
    text-overflow: clip !important;
  }
}

@media (max-width: 380px) {
  .app-tools-card {
    padding-left: 6px !important;
    padding-right: 6px !important;
  }

  .app-tools-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
    column-gap: 2px !important;
    row-gap: 9px !important;
  }

  .app-tool-icon {
    width: 44px !important;
    height: 44px !important;
    border-radius: 13px !important;
    font-size: 17px !important;
  }

  .app-tool-icon b {
    font-size: 14px !important;
  }

  .app-tool-item strong {
    font-size: 9px !important;
    min-height: 21px !important;
  }

  .app-tool-item small {
    font-size: 6.8px !important;
    min-height: 14px !important;
  }
}
</style>
'''.strip()

          pattern = re.compile(r'\n?<style id="important-section-compact-v2">.*?</style>\n?', re.S)
          html = pattern.sub('\n', html)

          if '</head>' not in html:
              raise SystemExit('index.html has no </head>')

          html = html.replace('</head>', block + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Commit compact layout
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compact important section into three mobile rows"
          git push origin HEAD:main
