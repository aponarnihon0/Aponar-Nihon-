name: App Grid Compact V20
on:
  push:
    paths:
      - '.github/workflows/app-grid-compact-v20.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact important tools grid and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'aponar-nihon-static-v\d+','aponar-nihon-static-v20',s)
          s=re.sub(r'aponar-nihon-dynamic-v\d+','aponar-nihon-dynamic-v20',s)
          replacements={
            ".app-tools-card{margin-top:14px!important;padding:16px 8px 13px!important;border-radius:22px!important}":".app-tools-card{margin-top:12px!important;padding:13px 7px 10px!important;border-radius:22px!important}",
            ".app-card-heading{padding:0 5px 10px!important}":".app-card-heading{padding:0 5px 7px!important}",
            ".app-tools-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:3px!important;row-gap:10px!important;align-items:start!important}":".app-tools-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:1px!important;row-gap:4px!important;align-items:start!important;grid-auto-rows:min-content!important}",
            ".app-tool-item{min-width:0!important;gap:0!important}":".app-tool-item{min-width:0!important;min-height:0!important;height:auto!important;padding:0!important;margin:0!important;gap:0!important;align-self:start!important}",
            ".app-tool-icon{width:47px!important;height:47px!important;border-radius:14px!important;margin-bottom:5px!important;font-size:18px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 13px rgba(38,62,89,.14)!important}":".app-tool-icon{width:47px!important;height:47px!important;border-radius:14px!important;margin:0 auto 3px!important;font-size:18px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 11px rgba(38,62,89,.13)!important}",
            ".app-tool-item strong{width:100%!important;min-height:22px!important;margin:0!important;font-size:9.6px!important;line-height:1.1!important;font-weight:800!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;display:flex!important;align-items:flex-start!important;justify-content:center!important}":".app-tool-item strong{width:100%!important;min-height:18px!important;margin:0!important;font-size:9.4px!important;line-height:1.05!important;font-weight:800!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;display:flex!important;align-items:flex-start!important;justify-content:center!important}",
            ".app-tool-item small{width:100%!important;min-height:15px!important;margin-top:1px!important;font-size:7.1px!important;line-height:1.08!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}":".app-tool-item small{width:100%!important;min-height:10px!important;margin-top:0!important;font-size:6.9px!important;line-height:1.02!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}",
            ".app-tools-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:2px!important;row-gap:9px!important}":".app-tools-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:1px!important;row-gap:3px!important}",
            ".app-tool-icon{width:44px!important;height:44px!important;border-radius:13px!important;font-size:17px!important}":".app-tool-icon{width:44px!important;height:44px!important;border-radius:13px!important;font-size:17px!important;margin-bottom:3px!important}",
            ".app-tool-item strong{font-size:9px!important;min-height:21px!important}":".app-tool-item strong{font-size:8.8px!important;min-height:17px!important}",
            ".app-tool-item small{font-size:6.8px!important;min-height:14px!important}":".app-tool-item small{font-size:6.6px!important;min-height:9px!important}"
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet || git commit -m "Compact important section grid and refresh app UI cache"
          git push