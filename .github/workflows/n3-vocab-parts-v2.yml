name: N3 Vocabulary Parts V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n3-vocab-parts-v2.yml'
      - 'n3-vocabulary-parts-v2.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire upgrade into N3 vocabulary page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('n3-vocabulary.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('জাপানে বাস্তবে ব্যবহারের ৩টি করে উদাহরণ','জাপানে বাস্তবে ব্যবহারের ৪টি করে উদাহরণ')
          s=s.replace('ফুরিগানা, বাংলা অর্থ এবং ৩টি বাস্তব উদাহরণ।','ফুরিগানা, বাংলা অর্থ এবং ৪টি বাস্তব উদাহরণ।')
          s=s.replace('<span>3 Parts</span><span>36 Core Words</span><span>108 Real Examples</span>','<span>6 Parts</span><span>36 Core Words</span><span>144 Real Examples</span>')
          tag='<script src="/n3-vocabulary-parts-v2.js?v=1"></script>'
          anchor='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if tag not in s and anchor in s:
              s=s.replace(anchor,tag+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          if '"/n3-vocabulary-parts-v2.js"' not in t:
              t=t.replace('  "/n3-vocabulary-original.css",\n','  "/n3-vocabulary-original.css",\n  "/n3-vocabulary-parts-v2.js",\n',1)
          nums=[int(x) for x in re.findall(r'aponar-nihon-(?:static|dynamic)-v(\d+)',t)]
          nxt=max(nums or [26])+1
          t=re.sub(r'aponar-nihon-static-v\d+',f'aponar-nihon-static-v{nxt}',t)
          t=re.sub(r'aponar-nihon-dynamic-v\d+',f'aponar-nihon-dynamic-v{nxt}',t)
          sw.write_text(t,encoding='utf-8')
          PY

      - name: Syntax check upgrade
        run: node --check n3-vocabulary-parts-v2.js

      - name: Commit N3 vocabulary wiring
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add n3-vocabulary.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Upgrade N3 vocabulary parts and examples"
            git push
          fi
