name: Restore N3 Vocabulary Design

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-n3-vocab-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply original design without touching vocabulary data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('n3-vocabulary.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta name="theme-color" content="#7c3aed">', '<meta name="theme-color" content="#101828">')
          link = '<link rel="stylesheet" href="/n3-vocabulary-original.css?v=1">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'aponar-nihon-(?:static|dynamic)-v(\d+)', t)]
          nxt = max(nums or [23]) + 1
          t = re.sub(r'aponar-nihon-static-v\d+', f'aponar-nihon-static-v{nxt}', t)
          t = re.sub(r'aponar-nihon-dynamic-v\d+', f'aponar-nihon-dynamic-v{nxt}', t)
          if '"/n3-vocabulary-original.css"' not in t and "'/n3-vocabulary-original.css'" not in t:
              anchor = '  "/n3-vocabulary.html",'
              if anchor in t:
                  t = t.replace(anchor, anchor + '\n  "/n3-vocabulary-original.css",', 1)
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Commit restored N3 vocabulary design
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add n3-vocabulary.html n3-vocabulary-original.css sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore original N3 vocabulary layout"
            git push
          fi
