name: N3 Vocabulary Polish V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n3-vocab-polish-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish part labels and four-example tip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('n3-vocabulary-parts-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("sub: `N3 Vocabulary • বাস্তব Japan usage • ${Math.min(WORDS_PER_PART, words.length - i)} words`,","sub: 'N3 Vocabulary • বাস্তব Japan usage',")
          old="if (typeof render === 'function') render();"
          new="""if (typeof render === 'function') render();
  document.querySelectorAll('.tip').forEach(el => {
    el.innerHTML = '<b>Study tip:</b> আগে শব্দ + বাংলা অর্থ দেখুন → তারপর ৪টা sentence জোরে পড়ুন → 🔊 দিয়ে pronunciation শুনুন → শেষে ✓ mark করুন।';
  });"""
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          nums=[int(x) for x in re.findall(r'aponar-nihon-(?:static|dynamic)-v(\d+)',t)]
          nxt=max(nums or [27])+1
          t=re.sub(r'aponar-nihon-static-v\d+',f'aponar-nihon-static-v{nxt}',t)
          t=re.sub(r'aponar-nihon-dynamic-v\d+',f'aponar-nihon-dynamic-v{nxt}',t)
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check n3-vocabulary-parts-v2.js
      - name: Commit
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add n3-vocabulary-parts-v2.js sw.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Polish N3 vocabulary parts" && git push; fi
