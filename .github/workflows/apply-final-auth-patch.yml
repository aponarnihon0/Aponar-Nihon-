name: Apply final auth patch
on:
  push:
    paths:
      - 'patch_final_auth.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_final_auth.py
      - name: Commit changes
        run: |
          rm -f patch_final_auth.py .github/workflows/apply-final-auth-patch.yml
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize premium auth profile and cache behavior"
          git push
