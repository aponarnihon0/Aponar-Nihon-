name: N3 Vocabulary Final UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n3-vocab-final-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final accordion behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('n3-vocabulary.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="n3-vocab-final-ui">'
          block='''<script id="n3-vocab-final-ui">
(() => {
  document.querySelectorAll('.part').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.tip').forEach(el => {
    el.innerHTML='<b>Study tip:</b> আগে শব্দ + বাংলা অর্থ দেখুন → তারপর ৪টা sentence জোরে পড়ুন → 🔊 দিয়ে pronunciation শুনুন → শেষে ✓ mark করুন।';
  });
})();
</script>'''
          anchor='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if marker not in s and anchor in s:
              s=s.replace(anchor,block+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          nums=[int(x) for x in re.findall(r'aponar-nihon-(?:static|dynamic)-v(\d+)',t)]
          nxt=max(nums or [27])+1
          t=re.sub(r'aponar-nihon-static-v\d+',f'aponar-nihon-static-v{nxt}',t)
          t=re.sub(r'aponar-nihon-dynamic-v\d+',f'aponar-nihon-dynamic-v{nxt}',t)
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Aponar Nihon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add n3-vocabulary.html sw.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Finalize N3 vocabulary accordion UI" && git push; fi
