<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<title>জাপানিজ কথোপকথন — বাংলা স্টাডি ইবুক</title>
<link rel="icon" href="/logo.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#173b5e;font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans JP",sans-serif}.loader{width:min(560px,calc(100% - 36px));text-align:center;padding:36px 24px;border-radius:26px;background:#fff;box-shadow:0 20px 60px rgba(23,59,94,.12)}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#df4d5a;color:#fff;font-size:30px;font-weight:900}.loader h1{font-size:25px;line-height:1.35;margin:0 0 8px}.loader p{margin:0;color:#718096;font-size:14px}.bar{height:7px;margin:24px auto 10px;border-radius:99px;background:#e9eef4;overflow:hidden}.bar i{display:block;width:34%;height:100%;border-radius:inherit;background:#176d6d;animation:move 1.1s ease-in-out infinite alternate}.status{font-size:12px;color:#6c7a89}.error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#fff2f1;color:#a63838;font-size:13px}.back{display:inline-block;margin-top:18px;color:#173b5e;font-weight:800;text-decoration:none}@keyframes move{from{transform:translateX(-10%)}to{transform:translateX(205%)}}
</style>
</head>
<body>
<div class="loader">
  <div class="mark">日</div>
  <h1>জাপানিজ কথোপকথন ইবুক</h1>
  <p>৭২৭টি বাক্যের ইন্টার‌্যাক্টিভ বই প্রস্তুত হচ্ছে…</p>
  <div class="bar"><i></i></div>
  <div class="status" id="status">বইয়ের ডাটা লোড হচ্ছে</div>
  <div class="error" id="error"></div>
  <a class="back" href="ebook-library.html">← E‑Book Library</a>
</div>
<script>
(async()=>{
  const files=[
    'ebook-data/jc-01.txt','ebook-data/jc-02.txt','ebook-data/jc-03.txt','ebook-data/jc-04.txt','ebook-data/jc-05.txt',
    'ebook-data/jc-06.txt','ebook-data/jc-07.txt','ebook-data/jc-08.txt','ebook-data/jc-09.txt','ebook-data/jc-10.txt',
    'ebook-data/jc-tail-1.txt','ebook-data/jc-tail-2.txt','ebook-data/jc-tail-3.txt'
  ];
  const status=document.getElementById('status');
  if(!('DecompressionStream' in window)) throw new Error('এই browser-এ eBook decompression support নেই। Chrome/Brave-এর নতুন version ব্যবহার করুন।');

  const parts=[];
  for(let i=0;i<files.length;i++){
    status.textContent=`বইয়ের ডাটা লোড হচ্ছে — ${i+1}/${files.length}`;
    const r=await fetch(files[i],{cache:'no-store'});
    if(!r.ok) throw new Error(`ডাটা ফাইল পাওয়া যায়নি: ${files[i]}`);
    parts.push(await r.text());
  }

  status.textContent='বই খোলা হচ্ছে…';
  let b64=parts.join('')
    .replace(/\s+/g,'')
    .replace(/-/g,'+')
    .replace(/_/g,'/')
    .replace(/=/g,'');
  b64 += '='.repeat((4-(b64.length%4))%4);

  let raw;
  try{
    raw=atob(b64);
  }catch(e){
    throw new Error('eBook Base64 data decode করা যায়নি।');
  }

  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);

  let html;
  try{
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    html=await new Response(stream).text();
  }catch(e){
    throw new Error('eBook gzip data খোলা যায়নি।');
  }

  if(!/<!doctype html|<html/i.test(html)) throw new Error('eBook data সঠিকভাবে decode হয়নি।');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  console.error(err);
  document.getElementById('status').textContent='বইটি খোলা যায়নি';
  const box=document.getElementById('error');
  box.style.display='block';
  box.textContent=err.message;
});
</script>
</body>
</html>
