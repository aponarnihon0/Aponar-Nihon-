<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Login / Register | Aponar Nihon</title><link rel="icon" href="/logo.png"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef6ff,#f7fbff);font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#173b5e}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #dce8f2;border-radius:26px;padding:24px;box-shadow:0 24px 70px rgba(23,59,94,.14)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.brand img{width:52px;height:52px}.brand b{font-size:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef5fb;padding:4px;border-radius:14px}.tabs button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:#6f8091}.tabs button.active{background:#176fa8;color:#fff}.pane{display:none}.pane.active{display:block}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #d6e2ec;border-radius:12px;padding:12px;font:inherit}.btn{width:100%;border:0;background:#176fa8;color:#fff;border-radius:12px;padding:12px;font-weight:900}.muted{font-size:11px;color:#7a8998}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#eef5fb;font-size:12px;display:none}.home{display:block;text-align:center;margin-top:15px;color:#176fa8;text-decoration:none;font-weight:800}</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="/logo.png"><div><b>APONAR NIHON</b><div class="muted">Student Account</div></div></div><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Register</button></div><div id="loginPane" class="pane active"><div class="field"><label>Email</label><input id="loginEmail" type="email"></div><div class="field"><label>Password</label><input id="loginPass" type="password"></div><button class="btn" id="loginBtn">Login</button><p class="muted">Account থাকলে email/password দিয়ে login করুন।</p></div><div id="regPane" class="pane"><div class="field"><label>নাম</label><input id="regName"></div><div class="field"><label>Email</label><input id="regEmail" type="email"></div><div class="field"><label>Password</label><input id="regPass" type="password" minlength="6"></div><div class="field"><label>JLPT Target</label><select id="regLevel"><option>N5</option><option>N4</option><option>N3</option><option>Other</option></select></div><button class="btn" id="regBtn">Register</button><p class="muted">Register করলে profile তৈরি হবে। Email verification চালু থাকলে inbox check করতে হবে।</p></div><div class="msg" id="msg"></div><a class="home" href="/">← হোম</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/account.js"></script><script>const $=id=>document.getElementById(id),show=(t)=>{const l=t==='login';$('loginTab').classList.toggle('active',l);$('regTab').classList.toggle('active',!l);$('loginPane').classList.toggle('active',l);$('regPane').classList.toggle('active',!l)};$('loginTab').onclick=()=>show('login');$('regTab').onclick=()=>show('reg');const message=(x,bad=false)=>{msg.style.display='block';msg.style.background=bad?'#fff0f0':'#eef8f3';msg.textContent=x};loginBtn.onclick=async()=>{const{error}=await AN.sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPass.value});if(error)return message(error.message,true);await AN.log('login');location.href='/profile.html'};regBtn.onclick=async()=>{const name=regName.value.trim();const{data,error}=await AN.sb.auth.signUp({email:regEmail.value.trim(),password:regPass.value,options:{data:{full_name:name,jlpt_target:regLevel.value}}});if(error)return message(error.message,true);message(data.session?'Registration successful.':'Registration successful. Email verify করুন।');if(data.session)location.href='/profile.html'};if(location.hash==='#register')show('reg');(async()=>{if(await AN.session())location.href='/profile.html'})();</script></body></html>
