<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Login / Register | Aponar Nihon</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/account.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/aponar-auth.js"></script></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><img src="/logo.png"><span>APONAR NIHON</span></a><div class="spacer"></div><a class="linkbtn" href="/">হোম</a></div></header><main class="wrap"><section class="hero"><div class="heroCard"><h1>Student Account</h1><p>Login করলে progress, quiz score, learning activity এবং profile account-এর সাথে save থাকবে।</p></div></section><div class="grid"><section class="card"><h2>Login</h2><p class="muted">আগের account থাকলে এখানে ঢুকুন।</p><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn" id="loginBtn">Login</button><button class="btn alt" id="forgotBtn">Forgot password</button></div><div id="loginMsg"></div></section><section class="card"><h2>Register</h2><p class="muted">নতুন student account তৈরি করুন।</p><div class="field"><label>নাম / 氏名</label><input id="regName" autocomplete="name"></div><div class="field"><label>Email</label><input id="regEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="regPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>JLPT Target</label><select id="regLevel"><option value="N5">N5</option><option value="N4">N4</option><option value="N3">N3</option><option value="N2">N2</option><option value="N1">N1</option></select></div><button class="btn" id="registerBtn">Register</button><div id="regMsg"></div></section></div></main><script>
const next=new URLSearchParams(location.search).get('next')||'/dashboard.html';
const show=(el,msg,kind='notice')=>el.innerHTML=`<div class="notice ${kind}">${msg}</div>`;
(async()=>{const u=await ANAuth.user();if(u)location.href=next})();
loginBtn.onclick=async()=>{loginBtn.disabled=true;const s=await ANAuth.db();const {error}=await s.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});loginBtn.disabled=false;if(error)return show(loginMsg,error.message,'error');show(loginMsg,'Login সফল ✅','ok');await ANAuth.track('account','login');location.href=next};
registerBtn.onclick=async()=>{registerBtn.disabled=true;const s=await ANAuth.db();const email=regEmail.value.trim(),password=regPassword.value,name=regName.value.trim();const {data,error}=await s.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+'/dashboard.html'}});registerBtn.disabled=false;if(error)return show(regMsg,error.message,'error');if(data.user){await s.from('profiles').update({full_name:name,jlpt_level:regLevel.value}).eq('id',data.user.id)}show(regMsg,data.session?'Account তৈরি হয়েছে ✅':'Account তৈরি হয়েছে। Email verification link থাকলে verify করুন।','ok');if(data.session)location.href='/dashboard.html'};
forgotBtn.onclick=async()=>{if(!loginEmail.value.trim())return show(loginMsg,'আগে Email লিখুন।','error');const s=await ANAuth.db();const {error}=await s.auth.resetPasswordForEmail(loginEmail.value.trim(),{redirectTo:location.origin+'/profile.html'});show(loginMsg,error?error.message:'Password reset email পাঠানো হয়েছে।',error?'error':'ok')};
</script></body></html>
