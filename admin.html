<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Panel | Aponar Nihon</title><link rel="icon" href="/logo.png"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#173b5e;font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{width:min(1180px,calc(100% - 22px));margin:auto}.top{background:#102f4d;color:#fff}.nav{height:68px;display:flex;align-items:center;gap:10px}.nav img{width:40px}.nav a,.nav button{margin-left:auto;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 10px;text-decoration:none}.hero{padding:26px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dfe7ef;border-radius:18px;padding:16px;box-shadow:0 8px 25px rgba(23,59,94,.05)}.stat b{display:block;font-size:28px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{border:1px solid #d8e3ec;border-radius:10px;padding:10px}.table{overflow:auto}.row{display:grid;grid-template-columns:1.3fr 1.6fr .7fr .8fr .9fr .7fr;gap:8px;padding:10px;border-bottom:1px solid #edf1f4;align-items:center;min-width:820px}.row.head{font-weight:900;background:#f4f8fb}.row button{border:0;background:#eaf4fb;color:#176fa8;border-radius:9px;padding:7px;font-weight:800}.detail{margin-top:14px;display:none}.activity{display:grid;gap:7px}.activity div{border:1px solid #e0e7ee;border-radius:10px;padding:9px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap nav"><img src="/logo.png"><b>APONAR NIHON · ADMIN</b><a href="/profile.html">Profile</a></div></header><main class="wrap"><section class="hero"><h1>Student Activity Dashboard</h1><p>Learning activity, registrations, level এবং recent usage। CV-এর ব্যক্তিগত content এখানে দেখানো হয় না।</p></section><div class="stats"><div class="stat"><b id="total">0</b><small>Total students</small></div><div class="stat"><b id="activeToday">0</b><small>Active today</small></div><div class="stat"><b id="n5">0</b><small>N5</small></div><div class="stat"><b id="n4n3">0</b><small>N4 + N3</small></div></div><div class="filters"><input id="search" placeholder="নাম বা email খুঁজুন"><select id="level"><option value="">সব level</option><option>N5</option><option>N4</option><option>N3</option><option>Other</option></select></div><section class="card table"><div class="row head"><div>Name</div><div>Email</div><div>Level</div><div>Activities</div><div>Last active</div><div>View</div></div><div id="rows"></div></section><section class="card detail" id="detail"><h2 id="dname"></h2><div id="dactivity" class="activity"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/account.js"></script><script>let students=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await AN.session();if(!s)return location.href='/auth.html';const me=await AN.profile();if(!me||me.role!=='admin')return location.href='/profile.html';const{data,error}=await AN.sb.rpc('admin_student_overview');if(error){rows.innerHTML='<div style="padding:14px">Admin data load failed.</div>';return}students=data||[];render();await AN.log('admin_view')}function render(){const q=search.value.toLowerCase(),lv=level.value;const f=students.filter(x=>(!lv||x.jlpt_target===lv)&&(!q||(x.full_name||'').toLowerCase().includes(q)||(x.email||'').toLowerCase().includes(q)));total.textContent=students.length;const today=new Date().toISOString().slice(0,10);activeToday.textContent=students.filter(x=>x.last_active&&x.last_active.slice(0,10)===today).length;n5.textContent=students.filter(x=>x.jlpt_target==='N5').length;n4n3.textContent=students.filter(x=>['N4','N3'].includes(x.jlpt_target)).length;rows.innerHTML=f.map(x=>`<div class="row"><div>${esc(x.full_name||'—')}</div><div>${esc(x.email||'')}</div><div>${esc(x.jlpt_target||'—')}</div><div>${x.activity_count||0}</div><div>${x.last_active?new Date(x.last_active).toLocaleDateString():'—'}</div><div><button onclick="viewStudent('${x.id}')">View</button></div></div>`).join('')}async function viewStudent(id){const x=students.find(s=>s.id===id);dname.textContent=x?.full_name||x?.email||'Student';detail.style.display='block';const{data=[]}=await AN.sb.rpc('admin_student_activity',{target_user:id});dactivity.innerHTML=data.length?data.map(a=>`<div><b>${esc(a.event_type)}</b><br><small>${esc(a.page||'')} · ${new Date(a.created_at).toLocaleString()}</small></div>`).join(''):'<div>No activity</div>';detail.scrollIntoView({behavior:'smooth'})}search.oninput=render;level.onchange=render;load();</script></body></html>
