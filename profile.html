<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Student Profile | Aponar Nihon</title><link rel="icon" href="/logo.png"><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#173b5e;font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{width:min(1050px,calc(100% - 22px));margin:auto}.top{background:#fff;border-bottom:1px solid #dfe8ef;position:sticky;top:0;z-index:10}.nav{height:68px;display:flex;align-items:center;gap:10px}.nav img{width:42px}.nav b{font-size:16px}.sp{flex:1}.nav a,.nav button{border:1px solid #d9e5ef;background:#fff;border-radius:11px;padding:9px 11px;color:#173b5e;text-decoration:none;font-weight:800}.hero{padding:28px 0}.heroBox{background:linear-gradient(135deg,#173b5e,#176fa8);color:#fff;padding:28px;border-radius:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dfe7ef;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(23,59,94,.06)}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric div{background:#f2f7fb;border-radius:14px;padding:14px;text-align:center}.metric b{display:block;font-size:24px}.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#748596}.field input,.field select{width:100%;border:1px solid #d8e3ec;border-radius:11px;padding:10px}.btn{border:0;background:#176fa8;color:#fff;border-radius:11px;padding:10px 14px;font-weight:900}.list{display:grid;gap:7px}.item{padding:10px;border:1px solid #e1e8ef;border-radius:12px}.item small{color:#7e8c99}@media(max-width:760px){.grid{grid-template-columns:1fr}.metric{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header class="top"><div class="wrap nav"><img src="/logo.png"><b>APONAR NIHON</b><div class="sp"></div><a href="/">হোম</a><a id="adminLink" href="/admin.html" style="display:none">Admin</a><button onclick="AN.logout()">Logout</button></div></header><main class="wrap"><section class="hero"><div class="heroBox"><div>STUDENT PROFILE</div><h1 id="hello">স্বাগতম</h1><p>আপনার learning progress, account এবং recent activity এক জায়গায়।</p></div></section><div class="grid"><section class="card"><h2>Profile</h2><div class="field"><label>নাম</label><input id="name"></div><div class="field"><label>School</label><input id="school"></div><div class="field"><label>Nationality</label><input id="nationality"></div><div class="field"><label>JLPT Target</label><select id="level"><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></div><div class="field"><label>Study goal</label><input id="goal" placeholder="例：JLPT N4 pass"></div><button class="btn" id="save">Save Profile</button></section><section class="card"><h2>My Learning</h2><div class="metric"><div><b id="events">0</b><small>Activities</small></div><div><b id="days">0</b><small>Active days</small></div><div><b id="last">—</b><small>Last active</small></div></div><p><a href="/student-tools.html">Student Toolkit →</a></p><p><a href="/ebook-library.html">E-Book Library →</a></p><p><a href="/cv-builder.html">CV Builder →</a></p></section><section class="card" style="grid-column:1/-1"><h2>Recent Activity</h2><div class="list" id="activity"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/account.js"></script><script>(async()=>{const s=await AN.session();if(!s)return location.href='/auth.html';const p=await AN.profile();if(!p)return;hello.textContent=`স্বাগতম, ${p.full_name||s.user.email}`;name.value=p.full_name||'';school.value=p.school_name||'';nationality.value=p.nationality||'';level.value=p.jlpt_level||'N5';goal.value=p.study_goal||'';if(p.role==='admin')adminLink.style.display='inline-block';save.onclick=async()=>{const{error}=await AN.sb.from('profiles').update({full_name:name.value.trim(),school_name:school.value.trim(),nationality:nationality.value.trim(),jlpt_level:level.value,study_goal:goal.value.trim(),updated_at:new Date().toISOString(),last_active_at:new Date().toISOString()}).eq('id',s.user.id);if(error)return alert(error.message);await AN.log('profile_update',{module:'profile'});alert('Profile saved')};const{data:a=[]}=await AN.sb.from('activity_events').select('event_type,module,item_key,created_at').eq('user_id',s.user.id).order('created_at',{ascending:false}).limit(30);events.textContent=a.length;days.textContent=new Set(a.map(x=>x.created_at.slice(0,10))).size;last.textContent=a[0]?new Date(a[0].created_at).toLocaleDateString():'—';activity.innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.event_type}</b><br><small>${x.module||''}${x.item_key?' · '+x.item_key:''} · ${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<div class="item">এখনও activity নেই।</div>';await AN.log('profile_view',{module:'profile'})})();</script></body></html>
